<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TicketNest</title><link rel="stylesheet" href="style.css"></head>
<body data-page="checkout">
<header class="site"><div class="wrap"><a class="logo" href="index.html">Ticket<span>Nest</span></a><nav><a href="index.html" data-i18n="nav.home"></a><a href="events.html" data-i18n="nav.events"></a><a href="booking.html" data-i18n="nav.book"></a><a href="checkout.html" class=active data-i18n="nav.checkout"></a><a href="confirmation.html" data-i18n="nav.ticket"></a><span id="lang"></span></nav></div></header>
<main><div class="wrap" id="content"><h2 data-i18n="checkout.heading"></h2><div class="two">
<form class="panel" id="form"><label for="name" data-i18n="checkout.name"></label><input id="name" required autocomplete="name">
<label for="email" data-i18n="checkout.email"></label><input id="email" type="email" required autocomplete="email">
<label for="card" data-i18n="checkout.card"></label><input id="card" required inputmode="numeric" pattern="[0-9 ]{12,19}" data-i18n-attr="placeholder:checkout.cardPlaceholder">
<div class="row"><div><label for="exp" data-i18n="checkout.exp"></label><input id="exp" required data-i18n-attr="placeholder:checkout.expPlaceholder"></div><div><label for="cvc" data-i18n="checkout.cvc"></label><input id="cvc" required inputmode="numeric" pattern="[0-9]{3,4}" data-i18n-attr="placeholder:checkout.cvcPlaceholder"></div></div>
<button class="btn" style="width:100%;margin-top:20px" data-i18n="checkout.pay"></button></form>
<div class="panel" id="summary"></div></div></div></main>
<footer><div class="wrap" data-i18n="footer.note"></div></footer>
<script src="locales/en.js"></script><script src="i18n.js"></script><script src="app.js"></script></body></html>
